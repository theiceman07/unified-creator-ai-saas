name: CreatorOS CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install pnpm
      run: npm install -g pnpm
        
    - name: Lint API
      run: |
        cd apps/api
        uv run ruff check .
        uv run mypy app
        
    - name: Test API
      run: |
        cd apps/api
        uv run pytest
        
    - name: Build Web
      run: |
        cd apps/web
        pnpm install
        pnpm build
