[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FaZeArjunn", email = "arjunjr101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.4",
    "mypy>=2.4.0",
    "pgvector>=0.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "ruff>=0.16.10",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "F401", "RUF013", "RUF012", "DTZ003", "UP035", "I001"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
